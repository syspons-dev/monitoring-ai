name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Configure npm auth
        run: |
          NPM_REGISTRY_HOST="${NPM_REGISTRY_URL#https://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST#http://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST%/}"
          cat <<EOF > ~/.npmrc
          @syspons:registry=${NPM_REGISTRY_URL}
          registry=${NPM_REGISTRY_URL}
          //${NPM_REGISTRY_HOST}/:_authToken=${NPM_TOKEN}
          always-auth=true
          EOF
        env:
          NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
