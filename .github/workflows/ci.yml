name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Configure npm auth
        run: |
          NPM_REGISTRY_HOST="${NPM_REGISTRY_URL#https://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST#http://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST%/}"
          cat <<EOF > ~/.npmrc
          @syspons:registry=${NPM_REGISTRY_URL}
          registry=${NPM_REGISTRY_URL}
          //${NPM_REGISTRY_HOST}/:_authToken=${NPM_TOKEN}
          always-auth=true
          EOF
        env:
          NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Configure npm auth
        run: |
          NPM_REGISTRY_HOST="${NPM_REGISTRY_URL#https://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST#http://}"
          NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST%/}"
          cat <<EOF > ~/.npmrc
          @syspons:registry=${NPM_REGISTRY_URL}
          registry=${NPM_REGISTRY_URL}
          //${NPM_REGISTRY_HOST}/:_authToken=${NPM_TOKEN}
          always-auth=true
          EOF
        env:
          NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
